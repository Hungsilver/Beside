# Phục vụ file tĩnh của PWA. TLS và các header bảo mật do Caddy đảm nhiệm.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Service worker & manifest PHẢI luôn lấy bản mới, nếu không người dùng
    # sẽ kẹt ở phiên bản cũ vĩnh viễn sau mỗi lần deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # File có hash trong tên → cache vĩnh viễn
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn không phải file đều trả index.html cho react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
