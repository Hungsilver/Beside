<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: nội dung tràn ra vùng tai thỏ, ta tự chừa bằng safe-area-inset -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#FF4D7D" />
    <meta name="description" content="Beside — check-in, lịch trình và đếm ngày yêu cho các cặp đôi" />

    <!-- iOS: cho phép chạy toàn màn hình khi đã thêm vào màn hình chính -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beside" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Dữ liệu vị trí là riêng tư: không cho công cụ tìm kiếm lập chỉ mục -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Beside</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
